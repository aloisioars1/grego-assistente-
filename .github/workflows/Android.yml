name: Android CI - AI Studio Final

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STORE_PASSWORD: "android123"
      KEY_PASSWORD: "android123"
      KEYSTORE_PATH: "my-upload-key.jks"
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Configurar Android SDK 36
        uses: android-actions/setup-android@v3

      - name: Criar arquivos que o AI Studio esqueceu
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then cp .env.example .env; fi
          if [ ! -f "app/google-services.json" ]; then
            mkdir -p app
            echo '{"project_info":{"project_number":"123","project_id":"fake"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:fake","android_client_info":{"package_name":"com.aistudio.chistegreek.wlmq"}}}],"configuration_version":"1"}' > app/google-services.json
          fi
          if [ ! -f "debug.keystore" ]; then
            rm -f debug.keystore
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug,O=Android,C=US" -noprompt
          fi
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkey -v -keystore my-upload-key.jks -alias upload -storepass android123 -keypass android123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Upload,O=Android,C=US" -noprompt
          fi
          ls -la *.keystore *.jks || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Gerar wrapper se não existir
        run: |
          if [ ! -f "./gradlew" ]; then gradle wrapper --gradle-version 8.7; fi
          chmod +x ./gradlew

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: chiste-grego-debug
          path: app/build/outputs/apk/debug/*.apk
