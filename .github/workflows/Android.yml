name: Android CI - AI Studio Final

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STORE_PASSWORD: "android123"
      KEY_PASSWORD: "android123"
      KEYSTORE_PATH: "my-upload-key.jks"
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21 (AGP 9.1.1 precisa)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Configurar Android SDK 36
        uses: android-actions/setup-android@v3

            - name: Criar arquivos que o AI Studio esqueceu
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then cp .env.example .env; fi
          mkdir -p app
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "chiste-grego-fake",
              "storage_bucket": "chiste-grego-fake.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abc123",
                  "android_client_info": {
                    "package_name": "com.aistudio.chistegreek.wlmq"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyFakeKeyForCIBuild1234567890ABC"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug,O=Android,C=US" -noprompt
          fi
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkey -v -keystore my-upload-key.jks -alias upload -storepass android123 -keypass android123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Upload,O=Android,C=US" -noprompt
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.3.1

      - name: Forçar wrapper para 9.3.1
        run: |
          if [ ! -f "./gradlew" ]; then gradle wrapper --gradle-version 9.3.1; fi
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip|' gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: chiste-grego-debug
          path: app/build/outputs/apk/debug/*.apk
