name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ver estrutura do projeto
        run: ls -la && echo "---" && find . -maxdepth 3 -name "gradlew" -type f

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Dar permissão ao gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "GRADLEW_PATH=./gradlew" >> $GITHUB_ENV
          elif [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
            echo "GRADLEW_PATH=./android/gradlew" >> $GITHUB_ENV
          else
            find . -name "gradlew" -exec chmod +x {} \;
            echo "GRADLEW_PATH=$(find . -name gradlew | head -n 1)" >> $GITHUB_ENV
          fi

      - name: Compilar APK Debug
        run: ${{ env.GRADLEW_PATH }} assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: |
            **/build/outputs/apk/debug/*.apk
            **/outputs/apk/debug/*.apk
