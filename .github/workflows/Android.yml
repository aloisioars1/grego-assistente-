name: Android CI - AI Studio Fix

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      # AI Studio não gera o gradlew, então a gente cria aqui
      - name: Gerar Gradle Wrapper que o AI Studio esqueceu
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Criar wrapper se não existir
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-aistudio-debug
          path: app/build/outputs/apk/debug/*.apk
